<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculatrice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <form action="" name="calc" class="calc">
        <input type="text" name="txt" class="ecran" value='0'>
        <div class="num">
            <button class="button clear button-clear" onclick="calc.txt.value=''">c</button>
            <button class="button button-operator" onclick="calc.txt.value+='/'">/</button>
            <button class="button button-operator" onclick="calc.txt.value+='*'">*</button>
            <button class="button button-number" onclick="calc.txt.value+='7'">7</button>
            <button class="button button-number" onclick="calc.txt.value+='8'">8</button>
            <button class="button button-number" onclick="calc.txt.value+='9'">9</button>
            <button class="button button-operator" onclick="calc.txt.value+='-'">-</button>
            <button class="button button-number" onclick="calc.txt.value+='4'">4</button>
            <button class="button button-number" onclick="calc.txt.value+='5'">5</button>
            <button class="button button-number" onclick="calc.txt.value+='6'">6</button>
            <button class="button plus button-operator" onclick="calc.txt.value+='+'">+</button>
            <button class="button button-number" onclick="calc.txt.value+='1'">1</button>
            <button class="button button-number" onclick="calc.txt.value+='2'">2</button>
            <button class="button button-number" onclick="calc.txt.value+='3'">3</button>
            <button class="button button-number" onclick="calc.txt.value+='0'">0</button>
            <button class="button button-number" onclick="calc.txt.value+='00'">00</button>
            <button class="button button-number" onclick="calc.txt.value+=','">,</button>
            <button class="button button-equals" onclick="calc.txt.value=eval(calc.txt.value)
            if (affiche.value=='Infinity') {
                affiche.value='MATH ERROR'
            }
            if (affiche.value=='undefined') {
                affiche.value='0'
            }
            ">=</button>
        </div>
       
    </form>
    </section>
    <script>
      const affiche=document.querySelector('.ecran')
      affiche.addEventListener('focus',function(){
          affiche.blur()
      })
    </script>
</body>
</html>
